<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suraksha Health Care | Account Security</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-body"><div class="login-card"><div class="login-top"><div class="brand"><span class="brand-mark">✚</span><span>Suraksha Health Care</span></div><select id="languageSelect" class="language-select" onchange="setLanguage(this.value)"><option value="en">English</option><option value="kn">ಕನ್ನಡ</option><option value="hi">हिन्दी</option></select></div><h1 data-i18n="Account Security">Account Security</h1><p class="muted" data-i18n="Save the email and phone you want to use for password recovery.">Save the email and phone you want to use for password recovery.</p>{% if error %}<div class="notification warning">{{ error }}</div>{% endif %}{% if success %}<div class="notification success">{{ success }}</div>{% endif %}<form method="post" style="display:grid;gap:14px;margin-top:22px"><input type="hidden" name="action" value="contact"><label><span data-i18n="Recovery email">Recovery email</span><input type="email" name="email" value="{{ user['email'] or '' }}" placeholder="you@example.com"></label><label><span data-i18n="Recovery phone">Recovery phone</span><input type="tel" name="phone" value="{{ user['phone'] or '' }}" placeholder="+91XXXXXXXXXX"></label><button class="btn primary" type="submit" data-i18n="Save recovery contact">Save recovery contact</button></form><hr style="margin:24px 0;border:0;border-top:1px solid #dbe5ec"><h2>Change Password</h2><p class="muted">Use a unique password with at least 10 characters.</p><form method="post" style="display:grid;gap:14px;margin-top:14px"><input type="hidden" name="action" value="password"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New password<input type="password" name="new_password" minlength="10" autocomplete="new-password" required></label><label>Confirm new password<input type="password" name="confirm_password" minlength="10" autocomplete="new-password" required></label><button class="btn primary" type="submit">Change password</button></form><p style="text-align:center;margin-top:18px"><a href="{{ url_for('home') }}" data-i18n="Back to dashboard">Back to dashboard</a></p></div><script src="{{ url_for('static', filename='script.js') }}"></script><script src="{{ url_for('static', filename='language.js') }}"></script></body></html>
