<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suraksha Health Care | Reset Password</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-body"><div class="login-card"><div class="login-top"><div class="brand"><span class="brand-mark">✚</span><span>Suraksha Health Care</span></div><select id="languageSelect" class="language-select" onchange="setLanguage(this.value)"><option value="en">English</option><option value="kn">ಕನ್ನಡ</option><option value="hi">हिन्दी</option></select></div><h1 data-i18n="Reset Password">Reset Password</h1>{% if error %}<div class="notification warning">{{ error }}</div>{% endif %}{% if success %}<div class="notification success">{{ success }}</div>{% endif %}{% if not success %}<form method="post" style="display:grid;gap:14px;margin-top:22px"><input type="hidden" name="username" value="{{ username }}"><input type="hidden" name="token" value="{{ token }}"><label data-i18n="Reset code">Reset code<input name="code" inputmode="numeric" maxlength="6" required></label><label data-i18n="New password">New password<input name="password" type="password" minlength="8" required></label><label data-i18n="Confirm password">Confirm password<input name="confirm_password" type="password" minlength="8" required></label><button class="btn primary" type="submit" data-i18n="Reset password">Reset password</button></form>{% endif %}<p style="text-align:center;margin-top:18px"><a href="{{ url_for('login') }}" data-i18n="Back to login">Back to login</a></p></div><script src="{{ url_for('static', filename='script.js') }}"></script><script src="{{ url_for('static', filename='language.js') }}"></script></body></html>
